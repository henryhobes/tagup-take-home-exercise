[project]
name = "maintenance"
version = "0.1.0"
description = "Aircraft maintenance write-up tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "python-multipart",
    "sqlalchemy",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
